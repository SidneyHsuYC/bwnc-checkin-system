<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.ico?v=1">
  <link rel="stylesheet" href="/css/styles.css">
  <title>Create Class</title>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back to Home</a>
    
    <header>
      <h1>Create Class</h1>
      <p class="subtitle">Add a new class to the system</p>
    </header>

    <div class="form-container">
      <div id="message" class="message hidden"></div>

      <form id="classForm">
        <div class="form-group">
          <label for="class_name">Class Name *</label>
          <input type="text" id="class_name" name="class_name" placeholder="e.g., Beginner Yoga, Advanced Piano" required>
        </div>

        <div class="form-group">
          <label for="start_date">Start Date *</label>
          <input type="date" id="start_date" name="start_date" required>
        </div>

        <div class="form-group">
          <label for="day_of_week">Day of Week *</label>
          <select id="day_of_week" name="day_of_week" required>
            <option value="">-- Select day --</option>
            <option value="Mon">Monday</option>
            <option value="Tue">Tuesday</option>
            <option value="Wed">Wednesday</option>
            <option value="Thu">Thursday</option>
            <option value="Fri">Friday</option>
            <option value="Sat">Saturday</option>
            <option value="Sun">Sunday</option>
          </select>
        </div>

        <div class="form-group">
          <label for="start_time">Start Time *</label>
          <input type="time" id="start_time" name="start_time" required>
        </div>

        <div class="form-group">
          <label for="end_time">End Time *</label>
          <input type="time" id="end_time" name="end_time" required>
        </div>

        <div class="form-group autocomplete-container">
          <label for="leader_name">Class Leader (Optional)</label>
          <input type="text" id="leader_name" name="leader_name" placeholder="Start typing student name..." autocomplete="off" readonly onfocus="this.removeAttribute('readonly');">
          <div id="leader_autocomplete_results" class="autocomplete-results hidden"></div>
          <input type="hidden" id="student_id" name="student_id">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Class</button>
      </form>
    </div>
  </div>

  <script src="/js/class.js"></script>
</body>
</html>
