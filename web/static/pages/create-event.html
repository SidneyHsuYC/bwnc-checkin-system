<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.ico?v=1">
  <link rel="stylesheet" href="/css/styles.css">
  <title>Create Event</title>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back to Home</a>
    
    <header>
      <h1>Create Event</h1>
      <p class="subtitle">Add a new event to the system</p>
    </header>

    <div class="form-container">
      <div id="message" class="message hidden"></div>

      <form id="eventForm">
        <div class="form-group">
          <label for="event_name">Event Name *</label>
          <input type="text" id="event_name" name="event_name" required>
        </div>

        <div class="form-group">
          <label for="event_time">Event Time *</label>
          <input type="datetime-local" id="event_time" name="event_time" required>
        </div>

        <div class="form-group">
          <label for="event_type">Event Type *</label>
          <input type="text" id="event_type" name="event_type" placeholder="e.g., Workshop, Seminar, Networking" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Event</button>
      </form>
    </div>
  </div>

  <script src="/js/event.js"></script>
</body>
</html>
